<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <!-- Transparent background -->
  <defs>
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Can body — crumpled/crushed, sketch style -->
  <!-- Main crushed body outline -->
  <path d="
    M 85,30
    C 100,24 122,26 138,32
    L 148,42
    C 152,48 150,56 148,60
    C 155,65 158,72 155,82
    L 150,92
    C 158,98 162,108 158,118
    C 164,122 165,134 158,142
    L 148,150
    C 142,158 130,164 118,168
    L 108,175
    C 98,185 92,195 90,210
    L 88,222
    C 86,232 90,240 96,244
    L 105,248
    C 88,252 72,250 65,244
    C 58,238 60,228 62,218
    L 64,205
    C 62,196 56,186 50,178
    L 42,165
    C 36,155 30,142 34,130
    L 38,118
    C 32,108 30,96 36,86
    L 42,76
    C 38,66 40,54 46,46
    Z"
    fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Top of can (ellipse — opened/crushed top view) -->
  <ellipse cx="112" cy="36" rx="35" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- Inner rim of top -->
  <ellipse cx="112" cy="36" rx="28" ry="10" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Pull tab ring -->
  <path d="M 108,30 L 115,30 L 117,26 C 119,23 123,22 126,25 C 129,28 127,32 124,33 L 118,33 L 116,30"
    fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tab hole opening -->
  <ellipse cx="110" cy="35" rx="6" ry="3" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Crush crinkle lines on body -->
  <!-- Upper crush zone -->
  <path d="M 42,76 C 60,70 80,74 95,68 C 110,62 130,66 148,60"
    fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 38,90 C 55,84 75,90 90,85 C 105,80 128,84 150,78"
    fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Mid crush accordion crinkles -->
  <path d="M 34,130 C 54,122 74,134 94,126 C 114,118 134,128 155,120"
    fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 36,108 C 55,102 74,112 94,105 C 113,98 133,108 156,102"
    fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Lower body indentation lines -->
  <path d="M 42,165 C 60,158 80,165 100,160 C 120,155 135,162 148,158"
    fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 50,178 C 65,172 85,180 105,174 C 122,168 138,175 145,170"
    fill="none" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

  <!-- Shading hatching on crushed side (left) -->
  <line x1="40" y1="100" x2="50" y2="125" stroke="#1a1a1a" stroke-width="0.9" opacity="0.3"/>
  <line x1="35" y1="108" x2="44" y2="132" stroke="#1a1a1a" stroke-width="0.9" opacity="0.25"/>
  <line x1="38" y1="118" x2="46" y2="142" stroke="#1a1a1a" stroke-width="0.8" opacity="0.2"/>

  <!-- Shading on right bulge -->
  <line x1="152" y1="92" x2="160" y2="115" stroke="#1a1a1a" stroke-width="0.9" opacity="0.3"/>
  <line x1="156" y1="105" x2="162" y2="128" stroke="#1a1a1a" stroke-width="0.8" opacity="0.25"/>

  <!-- Bottom crushed edge -->
  <path d="M 62,218 C 70,215 82,220 96,218 C 106,216 112,222 120,218"
    fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

  <!-- Ground shadow -->
  <ellipse cx="90" cy="252" rx="32" ry="6" fill="rgba(0,0,0,0.12)"/>
</svg>
